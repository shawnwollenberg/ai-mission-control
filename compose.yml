services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      NODE_ENV: production
      DATABASE_URL: postgresql://mission_control:mission_control_local@postgres:5432/mission_control
      PUBLIC_APP_URL: https://app.example.invalid
      MISSION_CONTROL_SESSION_SECRET: production-rehearsal-session-secret-000000000000
      SECURE_COOKIES: "true"
      SECRET_PROVIDER: rehearsal
      ARTIFACT_STORAGE_PROVIDER: s3
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-mission-control-rehearsal}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      ARTIFACT_S3_ENDPOINT: ${ARTIFACT_S3_ENDPOINT:-http://s3.invalid}
      ARTIFACT_S3_USE_IAM_ROLE: ${ARTIFACT_S3_USE_IAM_ROLE:-true}
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "3010:3000"
  project-brain-worker:
    build:
      context: .
      dockerfile: Dockerfile.project-brain-worker
    environment:
      APP_ENV: production
      PROCESS_TYPE: project_brain
      DATABASE_URL: postgresql://mission_control:mission_control_local@postgres:5432/mission_control
      SECRET_PROVIDER: rehearsal
      WORKER_ID: mc-project-brain-rehearsal-1
      WORKER_POLL_MS: "250"
      WORKSPACE_ID: ${WORKSPACE_ID:-}
      CODEX_REPOSITORY_ROOT: /repositories
      PROJECT_BRAIN_EXECUTABLE: /opt/project-brain/bin/project-brain
      PROJECT_BRAIN_REQUIRED_VERSION: 0.4.0
      PROJECT_BRAIN_CONTRACT_VERSION: "1.0"
      PROJECT_BRAIN_TIMEOUT_MS: "15000"
      PROJECT_BRAIN_MAX_OUTPUT_BYTES: "1000000"
      PROJECT_BRAIN_LOCAL_EXECUTION: enabled
      ARTIFACT_STORAGE_PROVIDER: s3
      ARTIFACT_S3_BUCKET: ${ARTIFACT_S3_BUCKET:-mission-control-rehearsal}
      ARTIFACT_S3_REGION: ${ARTIFACT_S3_REGION:-us-east-1}
      ARTIFACT_S3_ENDPOINT: ${ARTIFACT_S3_ENDPOINT:-http://s3.invalid}
      ARTIFACT_S3_USE_IAM_ROLE: ${ARTIFACT_S3_USE_IAM_ROLE:-true}
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ${PROJECT_BRAIN_REPOSITORY_ROOT:-./fixtures}:/repositories
    restart: unless-stopped
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_DB: mission_control
      POSTGRES_USER: mission_control
      POSTGRES_PASSWORD: mission_control_local
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission_control -d mission_control"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - mission-control-postgres:/var/lib/postgresql/data

volumes:
  mission-control-postgres:
